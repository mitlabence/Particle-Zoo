<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Particle Zoo — WebGPU</title>
  <style>
    :root {
      --bg: #08080c;
      --panel: #101017ee;
      --panel-border: #24242f;
      --text: #d8d8e2;
      --text-dim: #77778a;
      --accent: #7c9eff;
      --type-a: #ff6b6b;
      font-family: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 10;
    }

    #hud .title {
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    #hud b {
      color: var(--accent);
      font-weight: 600;
    }

    #panel {
      position: absolute;
      bottom: auto;
      top: 16px;
      right: 16px;
      width: 380px;
      max-height: calc(100vh - 32px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 14px 16px 16px;
      color: var(--text);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
      overflow: visible;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }


    /* Collapsed state: slide panel off-screen to the right */
    #panel.collapsed {
      transform: translateX(calc(100% - 6px));
    }

    /* Hide internal scroll/content slightly during collapse transition */
    #panelContent {
      overflow-y: auto;
      max-height: calc(100vh - 80px);
      transition: opacity 0.2s;
    }

    #panel.collapsed #panelContent {
      opacity: 0;
      pointer-events: none;
    }

    /* Toggle Button Styling */
    #panelToggle {
      position: inline-block;
      margin-bottom: 12px;
      background: #1f1f2e;
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      z-index: 12;
      transition: all 0.3s ease;
    }

    #panelToggle:hover {
      background: #2a2a3d;
    }

    /* Position button on the left outside edge when collapsed */
    #panel.collapsed #panelToggle {
      position: absolute;
      left: -48px;
      top: 0px;
      border-radius: 8px 0 0 8px;
      box-shadow: -4px 2px 10px rgba(0, 0, 0, 0.5);
      background: #14141d;
      padding: 10px 12px;
    }

    #panel h1 {
      font-size: 12px;
      margin: 0 0 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 500;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 11px;
    }

    .row label {
      color: var(--text-dim);
      flex: 0 0 auto;
    }

    .row .val {
      color: var(--accent);
      width: 44px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type=range] {
      flex: 1;
      height: 2px;
      appearance: none;
      background: #2a2a36;
      outline: none;
      border-radius: 2px;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #0c0c12;
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      background: #181822;
      border: 1px solid #2c2c3a;
      color: var(--text);
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }

    button:hover {
      border-color: var(--accent);
      color: #fff;
    }

    button:active {
      transform: translateY(1px);
    }

    #matrixWrap {
      margin-top: 14px;
      min-height: 320px;
    }

    #matrixWrap .cap {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #matrix {
      display: grid;
      gap: 3px;
      align-items: center;
    }

    .swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin: 0 auto;
    }

    .cell {
      height: 22px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }

    .corner {
      height: 22px;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 12px;
      font-size: 10px;
      color: var(--text-dim);
    }

    #legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    #unsupported {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 14px;
      text-align: center;
      padding: 40px;
      line-height: 1.6;
    }

    #unsupported b {
      color: var(--type-a);
    }
  </style>
</head>

<body>

  <canvas id="gpuCanvas"></canvas>

  <!-- Top Left Heads Up Display -->
  <div id="hud">
    <div class="title">PARTICLE ZOO</div>
    <div>fps <b id="fps">--</b></div>
    <div>particles <b id="hudParticles">6,000</b> · types <b id="hudTypes">3</b></div>
    <div>temp <b id="hudTemp">0.00</b></div>
    <!-- Real-time Type Distribution Pie Chart -->
    <div id="pieWrap">
      <svg id="pieGraph" viewBox="0 0 42 42">
        <!-- Dark placeholder background ring -->
        <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#1f1f2e" stroke-width="6" />
      </svg>
      <div id="pieLegend">
        <span style="color: var(--text-dim);">Initializing...</span>
      </div>
    </div>
  </div>

  <!-- Control Panel -->

  <div id="panel">
    <!-- Toggle Button -->
    <button id="panelToggle" aria-label="Toggle Panel">Hide Controls</button>
    <!-- Panel Content -->
    <div id="panelContent">
      <!-- Particle Config Controls -->
      <div class="row">
        <label for="numTypes">Particle types</label>
        <input type="range" id="numTypes" min="1" max="10" value="5" step="1">
        <span class="val" id="numTypesVal">5</span>
      </div>
      <div class="row">
        <label for="perType">Particles / type</label>
        <input type="range" id="perType" min="500" max="10000" value="1000" step="500">
        <span class="val" id="perTypeVal">1000</span>
      </div>

      <hr style="border:none; border-top:1px solid #1a1a26; margin:10px 0;">

      <!-- Physics Controls -->
      <div class="row">
        <label for="timeScaleSlider">
          Sim Speed: <span id="timeScaleVal">1.0x</span>
        </label>
        <input type="range" id="timeScaleSlider" min="0.1" max="10.0" step="0.1" value="1.0" />
      </div>
      <div class="row">
        <label for="rMax">Interaction radius</label>
        <input type="range" id="rMax" min="20" max="400" value="150" step="1">
        <span class="val" id="rMaxVal">150</span>
      </div>
      <div class="row">
        <label for="force">Force scale</label>
        <input type="range" id="force" min="0" max="1000" value="100" step="1">
        <span class="val" id="forceVal">1.00</span>
      </div>
      <div class="row">
        <label for="friction">Friction</label>
        <input type="range" id="friction" min="0" max="100" value="5" step="1">
        <span class="val" id="frictionVal">0.05</span>
      </div>

      <div class="btns">
        <button id="btnMatrix">Randomize Matrix</button>
        <button id="btnMasses">Randomize Masses</button>
        <button id="btnReset">Reset Positions</button>
        <button id="btnPause">Pause</button>
      </div>

      <div id="matrixWrap">
        <div class="cap">Interaction matrix (column acts on row, +: attraction, -: repulsion)</div>
        <div id="matrix"></div>
      </div>

      <div id="legend"></div>
      <div>
        <input type="checkbox" id="decayToggle" unchecked>
        <label for="decayToggle">Enable particle decay</label>
      </div>
    </div>
  </div>

  <div id="unsupported" style="display:none">
    This demo needs <b>WebGPU</b>.<br>
    Try a recent version of Chrome or Edge, and make sure hardware acceleration is enabled.
  </div>

  <script type="module">
    // --- CENTRAL SIMULATION CONFIGURATION ---
    const CONFIG = {
      // Mass Parameters
      MASS: {
        MIN: 0.5,
        MAX: 25.0,
      },

      // Decay Rate Parameters
      DECAY: {
        MIN_LAMBDA_RANGE: [0.0005, 0.0010], // [min, max] for random generation
        MAX_LAMBDA_RANGE: [0.0200, 0.0800],
        CURVE_POWER_RANGE: [1.2, 3.5],
        NOISE_RANGE: [0.9, 1.1],
        MIN_STEP: 0.0001,
      },

      // World Defaults
      WORLD: {
        // TODO: these need to agree with default value of sliders in HTML. Better solution: generate sliders from this config object?
        DEFAULT_NUM_TYPES: 5,
        DEFAULT_PER_TYPE: 1000,
        RMAX: 150,
        FORCE_SCALE: 1.00, // 100%
        FRICTION: 0.05,
        FUSION_THRESHOLD: 750.0, // Relative velocity threshold for kinetic fusion (in pixels/sec)
        FUSION_DISTANCE: 15.0,  // Distance threshold for kinetic fusion (in pixels)
      }
    };
    let numTypes = CONFIG.WORLD.DEFAULT_NUM_TYPES;
    let perType = CONFIG.WORLD.DEFAULT_PER_TYPE;
    let numParticles = numTypes * perType;

    // Dynamic Palette Generation (HSL spaced around color wheel)
    let typeColors = [];
    let typeMasses = [];
    let typeDecayRates = []; // λ values per type (0 = stable)

    const canvas = document.getElementById('gpuCanvas');

    async function main() {
      if (!navigator.gpu) {
        document.getElementById('unsupported').style.display = 'flex';
        return;
      }
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        document.getElementById('unsupported').style.display = 'flex';
        return;
      }
      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
        context.configure({ device, format, alphaMode: 'opaque' });
      }
      resize();
      window.addEventListener('resize', resize);

      // ==========================================
      // Async GPU Data Readback for Pie Chart
      // ==========================================
      let readbackBuffer = null;
      let lastPieUpdate = 0;
      let isMapping = false; // Prevents overlapping mapAsync calls

      function createReadbackBuffer() {
        if (readbackBuffer) readbackBuffer.destroy();
        readbackBuffer = device.createBuffer({
          size: particleData.byteLength,
          usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        });
      }

      async function updatePieChart(t) {
        // Rate-limit updates to every 400ms and ensure previous readback finished
        if (t - lastPieUpdate < 400 || isMapping || !readbackBuffer) return;
        lastPieUpdate = t;
        isMapping = true;

        // Calculate temperature of ensemble
        try {
          const commandEncoder = device.createCommandEncoder();
          commandEncoder.copyBufferToBuffer(particleBuffer, 0, readbackBuffer, 0, particleData.byteLength);
          device.queue.submit([commandEncoder.finish()]);

          await readbackBuffer.mapAsync(GPUMapMode.READ);
          const arrayBuffer = readbackBuffer.getMappedRange();
          const readData = new Float32Array(arrayBuffer);

          const counts = new Array(numTypes).fill(0);
          let totalKineticEnergy = 0;

          for (let i = 0; i < numParticles; i++) {
            const o = i * 6;
            const vx = readData[o + 2];
            const vy = readData[o + 3];
            const pType = Math.min(Math.max(0, Math.floor(readData[o + 4] + 0.5)), numTypes - 1);

            counts[pType]++;

            // Fetch mass of particle type (falls back to 1.0 if mass array isn't populated)
            const m = (typeof typeMasses !== 'undefined' && typeMasses[pType]) ? typeMasses[pType] : 1.0;

            // Accumulate Kinetic Energy: 0.5 * m * (vx^2 + vy^2)
            totalKineticEnergy += 0.5 * m * (vx * vx + vy * vy);
          }
          readbackBuffer.unmap();

          // 2D Ensemble Temperature: T = Total KE / N
          const systemTemp = totalKineticEnergy / numParticles;

          // Update HUD element
          const tempEl = document.getElementById('hudTemp');
          if (tempEl) tempEl.textContent = systemTemp.toFixed(2);

          // Render SVG Pie Chart
          const svg = document.getElementById('pieGraph');
          const legend = document.getElementById('pieLegend');

          // Base dark background ring
          svg.innerHTML = '<circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#1f1f2e" stroke-width="6" />';
          legend.innerHTML = '';

          let cumulativePercent = 0;

          for (let i = 0; i < numTypes; i++) {
            const fraction = counts[i] / numParticles;
            const percent = fraction * 100;

            // Skip 0% slices
            if (percent > 0) {
              const color = typeColors[i];
              const rgbStr = `rgb(${color[0] * 255 | 0},${color[1] * 255 | 0},${color[2] * 255 | 0})`;

              const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              circle.setAttribute('cx', '21');
              circle.setAttribute('cy', '21');
              circle.setAttribute('r', '15.91549430918954');
              circle.setAttribute('fill', 'transparent');
              circle.setAttribute('stroke', rgbStr);
              circle.setAttribute('stroke-width', '6');
              circle.setAttribute('stroke-dasharray', `${percent} ${100 - percent}`);
              circle.setAttribute('stroke-dashoffset', `${-cumulativePercent}`);
              svg.appendChild(circle);

              cumulativePercent += percent;

              // Add legend entry
              const row = document.createElement('div');
              row.style.color = rgbStr;
              row.textContent = `Type ${String.fromCharCode(65 + i)}: ${percent.toFixed(1)}%`;
              legend.appendChild(row);
            }
          }

        } catch (err) {
          console.warn("GPU Readback warning:", err);
        } finally {
          isMapping = false;
        }
      }

      // ==========================================
      // WGSL SHADERS (Compute & Render Pipeline)
      // ==========================================
      const shaderCode = /* wgsl */`
    struct Particle {
      pos: vec2f,
      vel: vec2f,
      ptype: f32,
      lifetime: f32, // Time left (in seconds) before this particle decays
    };

    struct Params {
      width: f32,
      height: f32,
      rMax: f32,
      dt: f32,
      friction: f32,
      forceScale: f32,
      numParticles: f32,
      numTypes: f32,
      seed: f32,
      enableDecay: f32, // 1.0 = active decay, 0.0 = decay disabled
      fusionThreshold: f32, // Relative velocity threshold for kinetic fusion (in pixels/sec)
      fusionDistance: f32,  // Distance threshold for kinetic fusion (in pixels)
    };

    @group(0) @binding(0) var<storage, read_write> particles: array<Particle>;
    @group(0) @binding(1) var<uniform> params: Params;
    @group(0) @binding(2) var<storage, read> matrix: array<f32>;
    @group(0) @binding(3) var<storage, read> masses: array<f32>;
    @group(0) @binding(4) var<storage, read> decayRates: array<f32>;

     /**
     * Calculates half-linear particle interactions:
     * Repulsion for short distances (r < beta), attraction/repulsion curve for (beta <= r < 1.0)
     */
    // TODO: other interaction types?
      fn particleForce(r: f32, a: f32) -> f32 {
      let beta = 0.3;
      if (r < beta) {
        return r / beta - 1.0;
      } else if (r < 1.0) {
        return a * (1.0 - abs(2.0 * r - 1.0 - beta) / (1.0 - beta));
      }
      return 0.0;
    }

    // --- COMPUTE STAGE 1: Calculate forces and update velocity ---
    @compute @workgroup_size(64)
    fn updateVelocity(@builtin(global_invocation_id) gid: vec3u) {
      let i = gid.x;
      if (i >= u32(params.numParticles)) { return; }
      let p = particles[i];
      var fx = 0.0;
      var fy = 0.0;
      let n = u32(params.numParticles);
      let numTypes = u32(params.numTypes);
      let halfW = params.width * 0.5;
      let halfH = params.height * 0.5;
      let pType = u32(p.ptype);
      let pMass = masses[pType];

       // N^2 interaction loop with periodic boundary (toroidal wrap)
      for (var j: u32 = 0u; j < n; j = j + 1u) {
        if (j == i) { continue; }
        let q = particles[j];
        var dx = q.pos.x - p.pos.x;
        var dy = q.pos.y - p.pos.y;
        
        // Toroidal shortest path wrapped distance calculation
        if (dx > halfW) { dx = dx - params.width; }
        else if (dx < -halfW) { dx = dx + params.width; }
        if (dy > halfH) { dy = dy - params.height; }
        else if (dy < -halfH) { dy = dy + params.height; }

        let dist2 = dx * dx + dy * dy;
        if (dist2 > 0.0001 && dist2 < params.rMax * params.rMax) {
          let dist = sqrt(dist2);
          let r = dist / params.rMax;
          let qMass = masses[u32(q.ptype)];
          // Look up force matrix coefficient: matrix[row * numTypes + col]
          let a = matrix[pType * numTypes + u32(q.ptype)];
          let f = particleForce(r, a) * qMass;
          fx = fx + (dx / dist) * f;
          fy = fy + (dy / dist) * f;
        }
      }

      // Apply forces and damp velocity via friction
      var vel = p.vel;
      vel.x = (vel.x + (fx / pMass) * params.forceScale * params.dt) * (1-params.friction);
      vel.y = (vel.y + (fy / pMass) * params.forceScale * params.dt) * (1-params.friction);
      particles[i].vel = vel;
    }

    // --- COMPUTE STAGE 2: Update position based on velocity ---
    @compute @workgroup_size(64)
    fn updatePosition(@builtin(global_invocation_id) gid: vec3u) {
      let i = gid.x;
      if (i >= u32(params.numParticles)) { return; }
      var pos = particles[i].pos;
      let vel = particles[i].vel;
      pos.x = pos.x + vel.x * params.dt;
      pos.y = pos.y + vel.y * params.dt;

      // Wrap coordinates around screen boundaries
      if (pos.x < 0.0) { pos.x = pos.x + params.width; }
      if (pos.x >= params.width) { pos.x = pos.x - params.width; }
      if (pos.y < 0.0) { pos.y = pos.y + params.height; }
      if (pos.y >= params.height) { pos.y = pos.y - params.height; }
      particles[i].pos = pos;
    }

    // --- RENDER STAGE: Instanced Quad Billboards ---
    struct VSOut {
      @builtin(position) pos: vec4f,
      @location(0) uv: vec2f,
      @location(1) color: vec3f,
    };

    // Extremely fast, stateless 32-bit integer hash for uniform [0, 1) floats
    fn hashFloat(seed: u32) -> f32 {
      var state = seed * 747796405u + 2891336453u;
      var word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
      word = (word >> 22u) ^ word;
      return f32(word) / 4294967296.0;
    }

    @compute @workgroup_size(64)
    fn updateDecay(@builtin(global_invocation_id) gid: vec3u) {
      if (params.enableDecay < 0.5) { return; }  

      let i = gid.x;
      if (i >= u32(params.numParticles)) { return; }

      var p = particles[i];
      let pType = u32(p.ptype);
      let numTypes = u32(params.numTypes);
      let maxType = numTypes - 1u;
      let halfW = params.width * 0.5;
      let halfH = params.height * 0.5;

      var tLeft = p.lifetime - params.dt;

      // FIXME: kinetic fusion: relative velocity does not take into account the time speed-up factor, so at high timeScale values, more likely to trigger fusion.
      // --- 1. KINETIC FUSION: kinetic energy of one particle fuels "upgrade" of another (in proximity) into higher mass state
      // (Symmetric thread-safe proximity check) ---
      if (pType < maxType) {
        for (var j = 0u; j < u32(params.numParticles); j = j + 1u) {
          if (j == i) { continue; }
          let q = particles[j];
          
          // Calculate wrapped toroidal distance
          var dx = q.pos.x - p.pos.x;
          var dy = q.pos.y - p.pos.y;
          if (dx > halfW) { dx = dx - params.width; }
          else if (dx < -halfW) { dx = dx + params.width; }
          if (dy > halfH) { dy = dy - params.height; }
          else if (dy < -halfH) { dy = dy + params.height; }

          let dist2 = dx * dx + dy * dy;

          // Fusion distance check
          if (dist2 < params.fusionDistance * params.fusionDistance) {
            let relVel = length(p.vel - q.vel);
            
            // Check relative velocity threshold
            if (relVel > params.fusionThreshold) {
              // Rule: The particle with LOWER type gets upgraded
              let qType = u32(q.ptype);
              if (pType <= qType) {
                // step up into random particle type
                //let nextType = pType + 1u;
                // Roll a random float between 0.0 and 1.0
                let randTarget = hashFloat(i + u32(params.seed) + 42u);
                // Power-law transformation: mapping r^n biases values strongly toward 0.0 (unlikely multiple jumps in particle hierarchy)
                let biasedRandTarget = pow(randTarget, 5.0);
                let availableTiers = f32(maxType - pType);
                let stepUp = 1u + u32(floor(biasedRandTarget * availableTiers));
                let nextType = min(maxType, pType + stepUp);

                p.ptype = f32(nextType);
                
                // Apply kinetic damping / momentum conservation to self
                let mP = masses[pType];
                let mQ = masses[qType];
                let deltaVel = q.vel * (mQ / (mP + mQ));
                p.vel = p.vel * 0.5 + deltaVel * 0.5;

                // Re-roll lifetime for upgraded state
                let lambda = decayRates[nextType];
                let u = clamp(hashFloat(i + u32(params.seed)), 1e-6, 0.999999);
                tLeft = select(1e9, -log(1.0 - u) / lambda, lambda > 0.0);
                break;
              }
            }
          }
        }
      }

      // --- 2. MULTI-STEP FISSION / DECAY ---
      if (tLeft <= 0.0) {
        if (pType > 0u) {
          // 1. Pick a decay target. Heavy particles can split deeply (e.g. down to ground state 0)
          // Roll a random float between 0.0 and 1.0
          let randTarget = hashFloat(i + u32(params.seed) + 42u);
          
          // Choose a target type strictly lower than pType
          // Squaring randTarget biases decays toward lower ground states (deep fission)
          let nextType = u32(floor(randTarget * randTarget * f32(pType)));

          let oldMass = masses[pType];
          let newMass = masses[nextType];
          p.ptype = f32(nextType);

          // 2. Mass-energy conversion: larger deltaMass creates high-velocity escape kicks
          let deltaMass = max(0.5, oldMass - newMass);
          let randomAngle = hashFloat(i + u32(params.seed) * 17u) * 6.2831853;
          let kickDir = vec2f(cos(randomAngle), sin(randomAngle));
          
          // High kinetic impulse boost (adjust multiplier as needed)
          let kickSpeed = 40.0 * sqrt(deltaMass); 
          p.vel = p.vel + kickDir * kickSpeed;

          // 3. Reset lifetime for the new lower state
          let lambda = decayRates[nextType];
          let u = clamp(hashFloat(i + u32(params.seed) + 1337u), 1e-6, 0.999999);
          tLeft = select(1e9, -log(1.0 - u) / lambda, lambda > 0.0);
        } else {
          tLeft = 1e9; // Ground state is stable
        }
      }

      // Write modified local particle state back to storage buffer
      p.lifetime = tLeft;
      particles[i] = p;
    }

    @group(0) @binding(0) var<storage, read> rParticles: array<Particle>;
    @group(0) @binding(1) var<uniform> rParams: Params;
    @group(0) @binding(2) var<storage, read> colors: array<vec4f>;
    @group(0) @binding(3) var<storage, read> rMasses: array<f32>;

    @vertex
    fn vs(@builtin(vertex_index) vid: u32, @builtin(instance_index) iid: u32) -> VSOut {
      var corners = array<vec2f, 6>(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
        vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0)
      );
      let corner = corners[vid];
      let p = rParticles[iid];

      const MIN_RADIUS: f32 = 1.5;
      const MAX_RADIUS: f32 = 10.0;
      const MIN_MASS: f32 = 0.1;
      const MAX_MASS: f32 = 10.0;

      let typeIdx = u32(p.ptype);
      let pMass = rMasses[typeIdx];

      // Linear interpolation: radius = MIN_RADIUS * (1 - t) + MAX_RADIUS * t
      let t = clamp((pMass - MIN_MASS) / (MAX_MASS - MIN_MASS), 0.0, 1.0);
      // Calculate the radius based on the particle's mass
      let radius = mix(MIN_RADIUS, MAX_RADIUS, t);
      let worldPos = p.pos + corner * radius;

      var out: VSOut;
      var ndc: vec2f;
      // Convert canvas pixel coordinates to Normalized Device Coordinates (-1.0 to 1.0)
      ndc.x = (worldPos.x / rParams.width) * 2.0 - 1.0;
      ndc.y = 1.0 - (worldPos.y / rParams.height) * 2.0;
      out.pos = vec4f(ndc, 0.0, 1.0);
      out.uv = corner;
      out.color = colors[u32(p.ptype)].rgb;
      return out;
    }

    @fragment
    fn fs(in: VSOut) -> @location(0) vec4f {
      let d = length(in.uv);
      if (d > 1.0) { discard; } // Anti-aliased circle boundary clipping
      let alpha = smoothstep(1.0, 0.55, d);
      return vec4f(in.color, alpha);
    }
  `;

      const shaderModule = device.createShaderModule({ code: shaderCode });

      // ==========================================
      // Dynamic Buffer Allocation State Variables
      // ==========================================
      let particleData, particleBuffer;
      let matrixData, matrixBuffer;
      let colorData, colorBuffer;
      let massData, massBuffer;
      let computeBindGroup, renderBindGroup;
      let decayRates, decayBuffer;

      const paramsData = new Float32Array(12);
      const paramsBuffer = device.createBuffer({
        size: paramsData.byteLength,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      // Bind Group Layouts
      const computeBGL = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
          { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
          { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
          { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
          { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
        ]
      });
      const renderBGL = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
          { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
          { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
          { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
        ]
      });

      // Pipelines
      const velPipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [computeBGL] }),
        compute: { module: shaderModule, entryPoint: 'updateVelocity' }
      });
      const posPipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [computeBGL] }),
        compute: { module: shaderModule, entryPoint: 'updatePosition' }
      });
      const decayPipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [computeBGL] }),
        compute: { module: shaderModule, entryPoint: 'updateDecay' }
      });
      const renderPipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [renderBGL] }),
        vertex: { module: shaderModule, entryPoint: 'vs' },
        fragment: {
          module: shaderModule, entryPoint: 'fs',
          targets: [{
            format,
            blend: {
              color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
              alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
            }
          }]
        },
        primitive: { topology: 'triangle-list' },
      });

      // Helper function to sort and sync mass hierarchy
      function sortAndSyncMassHierarchy(raw) {
        // 1. Re-sort by mass ascending
        raw.sort((a, b) => a.mass - b.mass);
        typeColors = raw.map(item => item.color);
        typeMasses = raw.map(item => item.mass);

        // 2. Recalculate Decay Rates (λ)
        typeDecayRates = [];
        const minMass = typeMasses[0];
        const maxMass = typeMasses[typeMasses.length - 1];
        const [minL_low, minL_high] = CONFIG.DECAY.MIN_LAMBDA_RANGE;
        const [maxL_low, maxL_high] = CONFIG.DECAY.MAX_LAMBDA_RANGE;
        const [powerMin, powerMax] = CONFIG.DECAY.CURVE_POWER_RANGE;
        const [noiseMin, noiseMax] = CONFIG.DECAY.NOISE_RANGE;


        const minLambda = minL_low + Math.random() * (minL_high - minL_low);
        const maxLambda = maxL_low + Math.random() * (maxL_high - maxL_low);
        const curvePower = powerMin + Math.random() * (powerMax - powerMin);

        for (let i = 0; i < numTypes; i++) {
          if (i === 0 || maxMass === minMass) {
            typeDecayRates.push(0.0); // Lightest/base type is stable
          } else {
            const norm = (typeMasses[i] - minMass) / (maxMass - minMass);
            // Bias the normalization with random curve power
            const biasedNorm = Math.pow(norm, curvePower);
            // Exponential interpolation across order of magnitude
            let lambda = minLambda * Math.pow(maxLambda / minLambda, biasedNorm);
            // Add some noise to the decay rate
            const noise = noiseMin + Math.random() * (noiseMax - noiseMin);
            lambda *= noise;
            typeDecayRates.push(lambda);
          }
        }

        // 3. Only sync to GPU if buffers have been allocated
        if (massBuffer && colorBuffer && decayBuffer) {
          typeMasses.forEach((m, i) => { massData[i] = m; });
          typeColors.forEach((c, i) => {
            colorData[i * 4 + 0] = c[0];
            colorData[i * 4 + 1] = c[1];
            colorData[i * 4 + 2] = c[2];
            colorData[i * 4 + 3] = 1.0;
          });
          typeDecayRates.forEach((r, i) => { decayRates[i] = r; });

          device.queue.writeBuffer(massBuffer, 0, massData);
          device.queue.writeBuffer(colorBuffer, 0, colorData);
          device.queue.writeBuffer(decayBuffer, 0, decayRates);
        }
      }

      function generatePaletteAndMasses(count) {
        let raw = [];
        for (let i = 0; i < count; i++) {
          const hue = (i * (360 / count)) % 360;
          const c = 0.85, x = c * (1 - Math.abs((hue / 60) % 2 - 1));
          let r = 0, g = 0, b = 0;
          if (hue < 60) { r = c; g = x; }
          else if (hue < 120) { r = x; g = c; }
          else if (hue < 180) { g = c; b = x; }
          else if (hue < 240) { g = x; b = c; }
          else if (hue < 300) { r = x; b = c; }
          else { r = c; b = x; }
          const m = 0.15;
          const randomMass = 0.5 + Math.random() * 9.5;
          raw.push({ color: [r + m, g + m, b + m], mass: parseFloat(randomMass.toFixed(2)) });
        }
        sortAndSyncMassHierarchy(raw);
      }

      // Function to sample lifetime from Exponential Distribution: T = -ln(1 - U) / λ
      function sampleLifetime(lambda) {
        if (lambda <= 0) return 1e9; // Ground state / stable particles live effectively forever
        const u = Math.random();
        return -Math.log(1 - u) / lambda;
      }

      /**
       * Initializes or recreates GPU memory buffers based on current numTypes and perType
       */
      function rebuildBuffers() {
        numParticles = numTypes * perType;
        generatePaletteAndMasses(numTypes);

        // 1. Particle Buffer Creation
        particleData = new Float32Array(numParticles * 6); // 6 floats per struct (pos, vel, type, pad)
        for (let i = 0; i < numParticles; i++) {
          const type = i % numTypes;
          const lambda = typeDecayRates[type];  // Poisson decay rate for this particle type
          const o = i * 6;
          particleData[o + 0] = Math.random() * canvas.width;
          particleData[o + 1] = Math.random() * canvas.height;
          particleData[o + 2] = 0; // vel x
          particleData[o + 3] = 0; // vel y
          particleData[o + 4] = type;
          particleData[o + 5] = sampleLifetime(lambda); // Initial pre-rolled lifetime
        }

        if (particleBuffer) particleBuffer.destroy();
        particleBuffer = device.createBuffer({
          size: particleData.byteLength,
          // CRITICAL: COPY_SRC must be enabled to copy particleBuffer -> readbackBuffer
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
        });
        device.queue.writeBuffer(particleBuffer, 0, particleData);

        // 2. Interaction Matrix Buffer Creation
        matrixData = new Float32Array(numTypes * numTypes);
        for (let i = 0; i < matrixData.length; i++) {
          matrixData[i] = (Math.random() * 2 - 1);
        }
        if (matrixBuffer) matrixBuffer.destroy();
        matrixBuffer = device.createBuffer({
          size: matrixData.byteLength,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(matrixBuffer, 0, matrixData);

        // 3. Color and Mass Buffer Creation
        colorData = new Float32Array(numTypes * 4);
        typeColors.forEach((c, i) => {
          colorData[i * 4 + 0] = c[0];
          colorData[i * 4 + 1] = c[1];
          colorData[i * 4 + 2] = c[2];
          colorData[i * 4 + 3] = 1.0;
        });
        if (colorBuffer) colorBuffer.destroy();
        colorBuffer = device.createBuffer({
          size: colorData.byteLength,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(colorBuffer, 0, colorData);

        // Ensure massData float array length is padded to a multiple of 4 (16 bytes)
        const paddedTypeCount = Math.ceil(numTypes / 4) * 4;
        massData = new Float32Array(paddedTypeCount);
        decayRates = new Float32Array(paddedTypeCount);

        typeMasses.forEach((m, i) => { massData[i] = m; });
        typeDecayRates.forEach((r, i) => { decayRates[i] = r; });

        if (massBuffer) massBuffer.destroy();
        massBuffer = device.createBuffer({
          size: massData.byteLength,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(massBuffer, 0, massData);

        if (decayBuffer) decayBuffer.destroy();
        decayBuffer = device.createBuffer({
          size: decayRates.byteLength,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(decayBuffer, 0, decayRates);

        createReadbackBuffer(); // for pie chart readback 

        // 4. Re-bind GPU resources to Bind Groups
        computeBindGroup = device.createBindGroup({
          layout: computeBGL,
          entries: [
            { binding: 0, resource: { buffer: particleBuffer } },
            { binding: 1, resource: { buffer: paramsBuffer } },
            { binding: 2, resource: { buffer: matrixBuffer } },
            { binding: 3, resource: { buffer: massBuffer } },
            { binding: 4, resource: { buffer: decayBuffer } },
          ]
        });
        renderBindGroup = device.createBindGroup({
          layout: renderBGL,
          entries: [
            { binding: 0, resource: { buffer: particleBuffer } },
            { binding: 1, resource: { buffer: paramsBuffer } },
            { binding: 2, resource: { buffer: colorBuffer } },
            { binding: 3, resource: { buffer: massBuffer } },
          ]
        });

        // Update HUD & UI Grid
        document.getElementById('hudParticles').textContent = numParticles.toLocaleString();
        document.getElementById('hudTypes').textContent = numTypes;
        renderMatrixUI();
        renderLegendUI();
      }

      function randomizeMatrix() {
        for (let i = 0; i < matrixData.length; i++) {
          matrixData[i] = (Math.random() * 2 - 1);
        }
        device.queue.writeBuffer(matrixBuffer, 0, matrixData);
        renderMatrixUI();
      }

      function randomizeMasses() {
        let raw = [];
        for (let i = 0; i < numTypes; i++) {
          const randomMass = 0.5 + Math.random() * 9.5;
          raw.push({
            color: typeColors[i],
            mass: parseFloat(randomMass.toFixed(2))
          });
        }

        sortAndSyncMassHierarchy(raw);

        renderMatrixUI();
        renderLegendUI();
      }

      // ==========================================
      // UI Rendering & Event Listeners
      // ==========================================
      function renderMatrixUI() {
        const grid = document.getElementById('matrix');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `16px repeat(${numTypes}, 1fr)`;
        const labelColors = typeColors.map(c => `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`);

        grid.appendChild(Object.assign(document.createElement('div'), { className: 'corner' }));

        for (let c = 0; c < numTypes; c++) {
          const sw = document.createElement('div');
          sw.className = 'swatch';
          sw.style.background = labelColors[c];
          grid.appendChild(sw);
        }

        for (let r = 0; r < numTypes; r++) {
          const sw = document.createElement('div');
          sw.className = 'swatch';
          sw.style.background = labelColors[r];
          grid.appendChild(sw);
          for (let c = 0; c < numTypes; c++) {
            const v = matrixData[r * numTypes + c];
            const cell = document.createElement('div');
            cell.className = 'cell';
            const mag = Math.min(Math.abs(v), 1);
            cell.style.background = v >= 0
              ? `rgba(124,158,255,${0.25 + 0.55 * mag})`
              : `rgba(255,107,107,${0.25 + 0.55 * mag})`;
            cell.textContent = v.toFixed(2);
            grid.appendChild(cell);
          }
        }
      }

      function renderLegendUI() {
        const legend = document.getElementById('legend');
        legend.innerHTML = '';

        // Get active speed multiplier
        const speed = state.timeScale || 1.0;

        // Container styling for a compact, readable grid/table
        legend.style.display = 'flex';
        legend.style.flexDirection = 'column';
        legend.style.gap = '6px';
        legend.style.marginTop = '12px';

        typeColors.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'type-card';
          row.style.cssText = `
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #14141d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
    `;

          const rgbStr = `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
          const mass = typeMasses[i] !== undefined ? typeMasses[i].toFixed(2) : '1.00';
          const lambda = typeDecayRates[i] !== undefined ? typeDecayRates[i] : 0;

          // Calculate half-life tau (t1/2) for intuitive physical meaning
          const halfLife = lambda > 0 ? (0.693 / (lambda * speed)).toFixed(0) + 's' : '∞';
          const lambdaText = lambda > 0 ? lambda.toFixed(4) : '0.0000 (stable)';

          row.innerHTML = `
      <div style="display: flex; align-items: center; gap: 8px;">
        <i style="width: 10px; height: 10px; border-radius: 50%; background: ${rgbStr}; display: inline-block; flex-shrink: 0;"></i>
        <span style="font-weight: 600; color: var(--text);">Type ${String.fromCharCode(65 + i)}</span>
      </div>
      <div style="display: flex; gap: 12px; font-variant-numeric: tabular-nums;">
        <span style="color: var(--text-dim);">m: <b style="color: var(--accent);">${mass}</b></span>
        <span style="color: var(--text-dim);">&lambda;: <b style="color: var(--text);">${lambdaText}</b></span>
        <span style="color: var(--text-dim);">&tau;<sub>&frac12; eff</sub>: <b style="color: #ffb74d;">${halfLife}</b></span>
      </div>
    `;

          legend.appendChild(row);
        });
      }

      // --- Dynamic Sliders & Control Input Listeners ---
      const state = { rMax: CONFIG.WORLD.RMAX, forceScale: CONFIG.WORLD.FORCE_SCALE, friction: CONFIG.WORLD.FRICTION, fusionThreshold: CONFIG.WORLD.FUSION_THRESHOLD, fusionDistance: CONFIG.WORLD.FUSION_DISTANCE, paused: false };

      const panel = document.getElementById('panel');
      const panelToggle = document.getElementById('panelToggle');

      panelToggle.addEventListener('click', () => {
        panel.classList.toggle('collapsed');

        const isCollapsed = panel.classList.contains('collapsed');
        panelToggle.textContent = isCollapsed ? '<<' : 'Hide Controls';
      });

      const numTypesEl = document.getElementById('numTypes');
      const numTypesVal = document.getElementById('numTypesVal');
      numTypesEl.addEventListener('input', () => {
        numTypes = parseInt(numTypesEl.value, 10);
        numTypesVal.textContent = numTypes;
        rebuildBuffers();
      });

      const perTypeEl = document.getElementById('perType');
      const perTypeVal = document.getElementById('perTypeVal');
      perTypeEl.addEventListener('input', () => {
        perType = parseInt(perTypeEl.value, 10);
        perTypeVal.textContent = perType;
        rebuildBuffers();
      });


      state.timeScale = 1.0;
      const speedSlider = document.getElementById('timeScaleSlider');
      const speedVal = document.getElementById('timeScaleVal');
      speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.timeScale = val;
        speedVal.textContent = val.toFixed(1) + 'x';

        // Recalculate UI legend to reflect effective wall-clock half-life
        renderLegendUI();
      });

      const rMaxEl = document.getElementById('rMax');
      const rMaxVal = document.getElementById('rMaxVal');
      rMaxEl.addEventListener('input', () => { state.rMax = +rMaxEl.value; rMaxVal.textContent = state.rMax; });

      const forceEl = document.getElementById('force');
      const forceVal = document.getElementById('forceVal');
      forceEl.addEventListener('input', () => { state.forceScale = +forceEl.value / 100; forceVal.textContent = state.forceScale.toFixed(2); });

      const frictionEl = document.getElementById('friction');
      const frictionVal = document.getElementById('frictionVal');
      frictionEl.addEventListener('input', () => { state.friction = +frictionEl.value / 100; frictionVal.textContent = state.friction.toFixed(2); });

      // Decay toggle listener
      const decayToggleEl = document.getElementById('decayToggle');
      if (decayToggleEl) {
        decayToggleEl.addEventListener('change', () => {
          state.enableDecay = decayToggleEl.checked;
        });
      }

      document.getElementById('btnMatrix').addEventListener('click', randomizeMatrix);
      document.getElementById('btnMasses').addEventListener('click', randomizeMasses);
      document.getElementById('btnReset').addEventListener('click', () => {
        for (let i = 0; i < numParticles; i++) {
          const o = i * 6;
          particleData[o + 0] = Math.random() * canvas.width;
          particleData[o + 1] = Math.random() * canvas.height;
          particleData[o + 2] = 0;
          particleData[o + 3] = 0;
        }
        device.queue.writeBuffer(particleBuffer, 0, particleData);
      });

      const btnPause = document.getElementById('btnPause');
      btnPause.addEventListener('click', () => {
        state.paused = !state.paused;
        btnPause.textContent = state.paused ? 'Resume' : 'Pause';
      });

      // Initialize GPU memory buffers and layout
      rebuildBuffers();

      // ==========================================
      // Main Render/Compute Frame Loop
      // ==========================================
      let lastT = performance.now();
      let frames = 0, fpsAcc = 0;
      const fpsEl = document.getElementById('fps');

      function frame(t) {
        const rawDt = Math.min((t - lastT) / 1000, 1 / 30);
        // Compute effective dt scaled by speed multiplier
        const dt = rawDt * state.timeScale;
        lastT = t;
        frames++; fpsAcc += dt;
        if (fpsAcc >= 0.5) {
          fpsEl.textContent = Math.round(frames / fpsAcc);
          frames = 0; fpsAcc = 0;
        }

        if (!state.paused) {

          /*
          struct Params {
            width: f32,
            height: f32,
            rMax: f32,
            dt: f32,
            friction: f32,
            forceScale: f32,
            numParticles: f32,
            numTypes: f32,
            seed: f32,
            enableDecay: f32, // 1.0 = active decay, 0.0 = decay disabled
            fusionThreshold: f32, // Relative velocity threshold for kinetic fusion (in pixels/sec)
            fusionDistance: f32,  // Distance threshold for kinetic fusion (in pixels)
          };
          */
          paramsData[0] = canvas.width;
          paramsData[1] = canvas.height;
          paramsData[2] = state.rMax * (canvas.width / (canvas.clientWidth || canvas.width));
          paramsData[3] = dt;
          paramsData[4] = state.friction;
          paramsData[5] = state.forceScale;
          paramsData[6] = numParticles;
          paramsData[7] = numTypes;
          paramsData[8] = Math.random() * 10000.0;
          paramsData[9] = state.enableDecay ? 1.0 : 0.0;
          paramsData[10] = state.fusionThreshold; // fusionThreshold (relative speed in px/s)
          paramsData[11] = state.fusionDistance; // fusionDistance (collision radius in px)
          device.queue.writeBuffer(paramsBuffer, 0, paramsData);

          const encoder = device.createCommandEncoder();
          const workgroups = Math.ceil(numParticles / 64);

          const cpass = encoder.beginComputePass();
          cpass.setBindGroup(0, computeBindGroup);
          cpass.setPipeline(velPipeline);
          cpass.dispatchWorkgroups(workgroups);
          cpass.setPipeline(posPipeline);
          cpass.dispatchWorkgroups(workgroups);
          cpass.setPipeline(decayPipeline);
          cpass.dispatchWorkgroups(workgroups);
          cpass.end();

          const view = context.getCurrentTexture().createView();
          const rpass = encoder.beginRenderPass({
            colorAttachments: [{
              view,
              clearValue: { r: 0.03, g: 0.03, b: 0.047, a: 1 },
              loadOp: 'clear',
              storeOp: 'store',
            }]
          });
          rpass.setPipeline(renderPipeline);
          rpass.setBindGroup(0, renderBindGroup);
          rpass.draw(6, numParticles);
          rpass.end();

          device.queue.submit([encoder.finish()]);
        }


        updatePieChart(t);


        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    main();
  </script>
